# Review R2: safety-masking telemetry. Positive bias (+0.02/+0.04 p.u.) on H1's reported voltage
# hides a real undervoltage from derating. IEEE 34 at 2035 and 2045 (2045 is where voltages get low).
name: fdi_mask
out_dir: ~/seams_runs
results_dir: seams/results
seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009]
keep_fine: [2000]
conditions:
  protection_only: {config: seams/config/phase2.yaml}
  contracts: {config: seams/config/phase5.yaml}
axes:
  - {name: elec, key: scenario.electrification, values: ["2035", "2045"]}
schedulers: [EDF]
scenarios:
  nominal: {attack: null}
  fdi_mask: {attack: seams/config/attacks/fdi_mask.yaml, param: attacks.0.bias_pu, values: [0.02, 0.04]}
