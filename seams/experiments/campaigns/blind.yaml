# RQ2 attribution baseline: blind tightening. Same contracts, monitors, shields and renegotiation
# as WARRANT at c = 1.0, but no attribution: any blame degrades every domain at every hub
# (renegotiation.attribution: blind). The WARRANT counterpart is rq2's contracts c = 1.0 (same
# seeds, scenarios, strengths), so no rerun is needed for it.
name: blind
out_dir: ~/seams_runs
results_dir: seams/results
seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009]
keep_fine: []
conditions:
  blind: {config: seams/config/phase5.yaml, set: {renegotiation.attribution: blind, contracts.conservatism: 1.0}}
schedulers: [EDF]
scenarios:
  nominal: {attack: null}
  navigation: {attack: seams/config/attacks/navigation.yaml, param: attacks.0.fraction, values: [0.25, 0.5, 0.75, 1.0]}
  fdi: {attack: seams/config/attacks/fdi.yaml, param: attacks.0.bias_pu, values: [-0.005, -0.01, -0.02, -0.04]}
  aggregator: {attack: seams/config/attacks/aggregator.yaml, param: attacks.*.fraction, values: [0.25, 0.5, 0.75, 1.0]}
