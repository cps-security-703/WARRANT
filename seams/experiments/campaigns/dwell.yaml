# Dwell sensitivity (guideline: "report results for two dwell settings"). Every hub session's dwell
# budget halved (bridge.dwell_scale 0.5) for protection only and contracts + renegotiation at the
# default conservatism (c = 1.0), EDF, the RQ2 seeds. The dwell 1.0 counterpart is the rq2
# campaign (same seeds, scenarios, strengths), so no rerun is needed for it.
name: dwell
out_dir: ~/seams_runs
results_dir: seams/results
seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009]
keep_fine: []
conditions:
  contracts: {config: seams/config/phase5.yaml, set: {bridge.dwell_scale: 0.5, contracts.conservatism: 1.0}}
  protection_only: {config: seams/config/phase2.yaml, set: {bridge.dwell_scale: 0.5}}
schedulers: [EDF]
scenarios:
  nominal: {attack: null}
  navigation: {attack: seams/config/attacks/navigation.yaml, param: attacks.0.fraction, values: [1.0]}
  fdi: {attack: seams/config/attacks/fdi.yaml, param: attacks.0.bias_pu, values: [-0.02, -0.04]}
  aggregator: {attack: seams/config/attacks/aggregator.yaml, param: attacks.*.fraction, values: [1.0]}
