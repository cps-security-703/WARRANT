# Screening for the default distrust estimator: WARRANT with the PCC-only "anchor" estimator
# (renegotiation.distrust_estimator: anchor) on both feeders at every load level, attack-free,
# single-meter FDI and coordinated two-meter FDI (bias -0.04). The MV estimator's results for the
# same cells are in electrification / feeder123 (nominal, fdi) and two_meter (IEEE 34, 2035, fdi2).
name: anchor_screen
out_dir: ~/seams_runs
results_dir: seams/results
seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009]
keep_fine: [2000]
conditions:
  anchor_ieee34: {config: seams/config/phase5.yaml, set: {renegotiation.distrust_estimator: anchor}}
  anchor_ieee123: {config: seams/config/phase5.yaml, set: {renegotiation.distrust_estimator: anchor, scenario.feeder: ieee123}}
axes:
  - {name: elec, key: scenario.electrification, values: [today, "2035", "2045"]}
schedulers: [EDF]
scenarios:
  nominal: {attack: null}
  fdi: {attack: seams/config/attacks/fdi.yaml, param: attacks.0.bias_pu, values: [-0.04]}
  fdi2: {attack: seams/config/attacks/fdi_two_meter.yaml, param: attacks.0.bias_pu, values: [-0.04]}
