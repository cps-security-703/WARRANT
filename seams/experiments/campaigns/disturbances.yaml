# Review experiment E3: accidental disturbances, no attacker (IEEE 34, 2035, EDF). Does
# attribution blame the grid for an honest change, and what does that cost against protection only?
name: disturbances
out_dir: ~/seams_runs
results_dir: seams/results
seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009]
keep_fine: [2000]
conditions:
  protection_only: {config: seams/config/phase2.yaml}
  contracts: {config: seams/config/phase5.yaml}
  # review experiment C: the detect-and-respond baseline (E1/B) on the same honest events
  ids_response: {config: seams/config/phase2.yaml, set: {ids_response.enabled: true}}
  ids_response_tids: {config: seams/config/phase2.yaml, set: {ids_response.enabled: true, ids_response.detector: transformer}}
schedulers: [EDF]
scenarios:
  capacitor_c848: {attack: seams/config/attacks/disturbance_capacitor.yaml}
  capacitor_c844: {attack: seams/config/attacks/disturbance_capacitor_c844.yaml}
  load_step: {attack: seams/config/attacks/disturbance_load.yaml, param: attacks.0.kw, values: [100, 200, 400]}
  meter_stuck: {attack: seams/config/attacks/disturbance_meter.yaml}
