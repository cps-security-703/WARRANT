# Review experiment A (eval): WARRANT with distrust_estimator "both" (estimate from the PCC-only
# anchor, exit only once V_rep agrees with both the anchor and the MV estimate). It targets the
# trade-off in two_meter / anchor_screen: the MV estimator is poisoned by a two-meter FDI, the
# anchor's exit bound grows past a -0.04 bias at 2045 on IEEE 34.
# Evaluation days, the anchor_screen grid (whose MV and anchor results it is compared with) plus
# the weaker two-meter bias of tab:twometer.
name: both_eval
out_dir: ~/seams_runs
results_dir: seams/results
seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009]
keep_fine: [2000]
conditions:
  both_ieee34: {config: seams/config/phase5.yaml, set: {renegotiation.distrust_estimator: both}}
  both_ieee123: {config: seams/config/phase5.yaml, set: {renegotiation.distrust_estimator: both, scenario.feeder: ieee123}}
axes:
  - {name: elec, key: scenario.electrification, values: [today, "2035", "2045"]}
schedulers: [EDF]
scenarios:
  nominal: {attack: null}
  fdi: {attack: seams/config/attacks/fdi.yaml, param: attacks.0.bias_pu, values: [-0.04]}
  fdi2: {attack: seams/config/attacks/fdi_two_meter.yaml, param: attacks.0.bias_pu, values: [-0.02, -0.04]}
