# RQ1 — containment and attribution, at the scenario defaults (IEEE 34, 2035 electrification).
# Each scripted scenario x {protection only, static contracts,
# contracts + renegotiation} x {EDF, LLF, RR}, strength swept from below threshold to clearly
# violating; a nominal day per cell for false-attribution rates and trip-delay twins.
name: rq1
out_dir: ~/seams_runs
results_dir: seams/results
seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009]   # fresh evaluation seeds
keep_fine: [2000]
conditions:
  protection_only: {config: seams/config/phase2.yaml}
  static_contracts: {config: seams/config/phase5.yaml, set: {renegotiation.enabled: false}}
  contracts: {config: seams/config/phase5.yaml}
schedulers: [EDF, LLF, RR]
scenarios:
  nominal: {attack: null}
  navigation: {attack: seams/config/attacks/navigation.yaml, param: attacks.0.fraction, values: [0.25, 0.5, 0.75, 1.0]}
  fdi: {attack: seams/config/attacks/fdi.yaml, param: attacks.0.bias_pu, values: [-0.005, -0.01, -0.02, -0.04]}
  aggregator: {attack: seams/config/attacks/aggregator.yaml, param: attacks.*.fraction, values: [0.25, 0.5, 0.75, 1.0]}
