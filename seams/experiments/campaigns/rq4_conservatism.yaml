# RQ4 across contract conservatism (guideline: compare agents and the classical optimizer "on the
# RQ2 sweep"; the main rq4 campaign is at c = 1.0). The floor protocol (Gemini) and its classical
# twin at c = 0.6 (tight) and 1.25 (loose), nominal and the foreseen scenarios at their strongest
# strength, EDF, the RQ4 evaluation seeds.
name: rq4_conservatism
out_dir: ~/seams_runs
results_dir: seams/results
seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009]
keep_fine: []
conditions:
  classical: {config: seams/config/phase5.yaml}
  agents_floor: {config: seams/config/phase8.yaml, set: {agents.plan_mode: floor}}
axes:
  - {name: c, key: contracts.conservatism, values: [0.6, 1.25]}
schedulers: [EDF]
scenarios:
  nominal: {attack: null}
  navigation: {attack: seams/config/attacks/navigation.yaml, param: attacks.0.fraction, values: [1.0]}
  fdi: {attack: seams/config/attacks/fdi.yaml, param: attacks.0.bias_pu, values: [-0.04]}
  aggregator: {attack: seams/config/attacks/aggregator.yaml, param: attacks.*.fraction, values: [1.0]}
