# RQ2 — cost frontier. Contract conservatism c (P_bar and lam_bar scaled by c) x attacker
# strength, with the uncontained cascade (protection only) and the centralized oracle as
# reference points. EDF.
name: rq2
out_dir: ~/seams_runs
results_dir: seams/results
seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009]
keep_fine: []
conditions:
  contracts: {config: seams/config/phase5.yaml}
  protection_only: {config: seams/config/phase2.yaml}
  oracle: {config: seams/config/phase2.yaml, set: {baseline: oracle}}
axes:
  - {name: c, key: contracts.conservatism, values: [0.6, 0.8, 1.0, 1.25], skip: [protection_only, oracle]}
schedulers: [EDF]
scenarios:
  nominal: {attack: null}
  navigation: {attack: seams/config/attacks/navigation.yaml, param: attacks.0.fraction, values: [0.25, 0.5, 0.75, 1.0]}
  fdi: {attack: seams/config/attacks/fdi.yaml, param: attacks.0.bias_pu, values: [-0.005, -0.01, -0.02, -0.04]}
  aggregator: {attack: seams/config/attacks/aggregator.yaml, param: attacks.*.fraction, values: [0.25, 0.5, 0.75, 1.0]}
