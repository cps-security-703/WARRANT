# Review experiment E7 (IEEE 34, 2035, EDF): coordinated two-meter FDI, which defeats the grid's
# bad-data detector and poisons any estimate that reads the MV meter.
#   protection_only, ids_response (E1's detect-and-respond baseline), contracts (WARRANT, default
#   distrust estimator "mv"), contracts_anchor (WARRANT with the PCC-only "anchor" estimator, an
#   existing design option). nominal for contracts_anchor gives its attack-free cost, and
#   fdi (single meter) at -0.04 checks the anchor estimator on the RQ1 attack.
name: two_meter
out_dir: ~/seams_runs
results_dir: seams/results
seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009]
keep_fine: [2000]
conditions:
  protection_only: {config: seams/config/phase2.yaml, scenarios: [fdi2]}
  ids_response: {config: seams/config/phase2.yaml, set: {ids_response.enabled: true}, scenarios: [fdi2]}
  contracts: {config: seams/config/phase5.yaml, scenarios: [fdi2]}
  contracts_anchor: {config: seams/config/phase5.yaml, set: {renegotiation.distrust_estimator: anchor}}
  # review experiment B: the same local response, triggered by the Transformer IDS (which still
  # alarms under the two-meter FDI) instead of the BDD; nominal gives its attack-free cost
  ids_response_tids: {config: seams/config/phase2.yaml, set: {ids_response.enabled: true, ids_response.detector: spear_transformer}}
schedulers: [EDF]
scenarios:
  nominal: {attack: null}
  fdi: {attack: seams/config/attacks/fdi.yaml, param: attacks.0.bias_pu, values: [-0.04]}
  fdi2: {attack: seams/config/attacks/fdi_two_meter.yaml, param: attacks.0.bias_pu, values: [-0.02, -0.04]}
