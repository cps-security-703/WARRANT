# Transport-origin cascades at a robotaxi depot (IEEE 123, 2035, scenario.hub_kind: dcfc_depot:
# 600 kW public fast-charging hubs, H2 with a 7-port depot for the 20-AV fleet). Compromised
# dispatcher (drain-then-converge, frozen on development seeds), grid telemetry falsification
# and aggregator release, each against protection only, static contracts, blind tightening
# and WARRANT. No LLM.
name: depot
out_dir: ~/seams_runs
results_dir: seams/results
seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009]
keep_fine: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009]
conditions:
  protection_only: {config: seams/config/phase2.yaml, set: {scenario.hub_kind: dcfc_depot, scenario.feeder: ieee123, scenario.electrification: "2035"}}
  static_contracts: {config: seams/config/phase5.yaml, set: {scenario.hub_kind: dcfc_depot, scenario.feeder: ieee123, scenario.electrification: "2035", renegotiation.enabled: false}}
  blind: {config: seams/config/phase5.yaml, set: {scenario.hub_kind: dcfc_depot, scenario.feeder: ieee123, scenario.electrification: "2035", renegotiation.attribution: blind}}
  contracts: {config: seams/config/phase5.yaml, set: {scenario.hub_kind: dcfc_depot, scenario.feeder: ieee123, scenario.electrification: "2035"}}
schedulers: [EDF]
scenarios:
  nominal: {attack: null}
  dispatch: {attack: seams/config/attacks/dispatch_drain.yaml, param: attacks.0.fraction, values: [0.25, 0.5, 0.75, 1.0]}
  fdi: {attack: seams/config/attacks/fdi.yaml, param: attacks.0.bias_pu, values: [-0.01, -0.02, -0.04]}
  aggregator: {attack: seams/config/attacks/aggregator.yaml, param: attacks.*.fraction, values: [0.5, 1.0]}
  navigation: {attack: seams/config/attacks/navigation.yaml, param: attacks.0.fraction, values: [1.0]}
