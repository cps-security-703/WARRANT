# Attacker-chosen timing for telemetry FDI (RQ1, charging side): the same falsification at the
# 08:30 morning peak instead of 16:30, on the weak (IEEE 34) and stiff (IEEE 123) feeder at 2035.
# Fine logs kept for every day so the charging trajectory can be shown for any of them.
name: fdi_morning
out_dir: ~/seams_runs
results_dir: seams/results
seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009]
keep_fine: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009]
conditions:
  protection_only: {config: seams/config/phase2.yaml}
  contracts: {config: seams/config/phase5.yaml}
axes:
  - {name: feeder, key: scenario.feeder, values: [ieee34, ieee123]}
schedulers: [EDF]
scenarios:
  nominal: {attack: null}
  fdi: {attack: seams/config/attacks/fdi_morning.yaml, param: attacks.0.bias_pu, values: [-0.04, -0.06, -0.08]}
