# Review experiment D: where WARRANT's attack-free cost comes from (IEEE 34, EDF, attack-free).
# Each certification margin is dropped in turn: D (empirical drift envelope D_h(k)), lin
# (linearization error), both (RQ3's "without eps"), and a 30 min V2 horizon instead of 1 h.
# Dropping a margin can make certificates unsound: violations are reported, not hidden.
name: cost_decomp
out_dir: ~/seams_runs
results_dir: seams/results
seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009]
keep_fine: [2000]
conditions:
  full: {config: seams/config/phase5.yaml}
  no_drift: {config: seams/config/phase5.yaml, set: {verifier.drop_eps: [D]}}
  no_lin: {config: seams/config/phase5.yaml, set: {verifier.drop_eps: [lin]}}
  no_eps: {config: seams/config/phase5.yaml, set: {verifier.use_epsilon: false}}
  horizon_30min: {config: seams/config/phase5.yaml, set: {verifier.horizon_s: 1800}}
axes:
  - {name: elec, key: scenario.electrification, values: ["2035", "2045"]}
schedulers: [EDF]
scenarios:
  nominal: {attack: null}
