# Second feeder (IEEE 123, a stiffer 4.16 kV feeder with four regulators): the electrification
# axis repeated, to test whether the findings depend on feeder strength. Same design.
name: feeder123
out_dir: ~/seams_runs
results_dir: seams/results
seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009]
keep_fine: []
conditions:
  protection_only: {config: seams/config/phase2.yaml, set: {scenario.feeder: ieee123}}
  contracts: {config: seams/config/phase5.yaml, set: {scenario.feeder: ieee123}}
axes:
  - {name: elec, key: scenario.electrification, values: [today, "2035", "2045"]}
schedulers: [EDF]
scenarios:
  nominal: {attack: null}
  navigation: {attack: seams/config/attacks/navigation.yaml, param: attacks.0.fraction, values: [1.0]}
  fdi: {attack: seams/config/attacks/fdi.yaml, param: attacks.0.bias_pu, values: [-0.04]}
  aggregator: {attack: seams/config/attacks/aggregator.yaml, param: attacks.*.fraction, values: [1.0]}
